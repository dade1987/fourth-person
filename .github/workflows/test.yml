name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  math:
    name: matematica, invarianti, percezione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Nessuna dipendenza: i test girano con Node e basta.
      # La copertura è una soglia, non un rapporto da guardare: se la parte pura
      # scende sotto, la build si ferma. Il rendering GPU è escluso apposta —
      # coprirlo con finti test farebbe salire il numero e abbassare la fiducia.
      - run: npm run test:coverage

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
