<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>quarta persona — non puoi vedere la quarta dimensione, puoi riconoscerla</title>
<meta name="description" content="Un gioco nel browser in cui abiti uno spazio a quattro dimensioni. Nessun occhiale, nessuna app. Apri il link e inclina il telefono.">
<meta property="og:title" content="quarta persona">
<meta property="og:description" content="Non puoi vedere la quarta dimensione. Puoi riconoscerla.">
<meta property="og:type" content="website">
<meta property="og:image" content="press/screenshots/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23090b10'/><rect x='6' y='6' width='20' height='20' fill='none' stroke='%238ec5ff' stroke-width='1.5'/><rect x='11' y='11' width='10' height='10' fill='none' stroke='%238ec5ff' stroke-width='1'/><path d='M6 6l5 5M26 6l-5 5M6 26l5-5M26 26l-5-5' stroke='%238ec5ff' stroke-width='.8'/></svg>">
<style>
  :root {
    --ink: #eef1f7;
    --dim: #9aa3b5;
    --bg: #08090c;
    --accent: #8ec5ff;
    --w-accent: #ffbe6b;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --pad: max(14px, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none; user-select: none;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }

  .fade { transition: opacity 260ms var(--ease), transform 260ms var(--ease); }
  /* Nascosto vuol dire nascosto: né l'elemento né ciò che contiene ricevono tocchi. */
  .hidden, .hidden * { opacity: 0; pointer-events: none !important; }
  .hidden { transform: translateY(6px); }
  .gone { display: none !important; }

  /* --------------------------------------------------------------- pile */
  /* Due sole colonne: tutto ciò che compare entra in una delle due e si impila.
     È l'unico modo per cui "non si sovrappone" sia vero per costruzione e non
     per fortuna — e c'è un test end-to-end che lo verifica su ogni schermata. */
  #top {
    position: absolute; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 var(--pad); pointer-events: none;
  }
  #texts {
    position: absolute; left: 0; right: calc(74px + env(safe-area-inset-right));
    bottom: calc(178px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px var(--pad) 10px; pointer-events: none;
    background: linear-gradient(to top, rgba(6,7,10,.75), rgba(6,7,10,.45) 60%, rgba(6,7,10,0));
  }
  #top > *, #texts > * { pointer-events: auto; }
  /* nascosto vuol dire fuori dal flusso: nessuno spazio vuoto, nessun residuo */
  #top > .hidden, #texts > .hidden, .gone { display: none !important; }

  #subtitle {
    margin: 0; max-width: 34rem; text-align: center;
    font-size: clamp(16px, 4.2vw, 21px); line-height: 1.38;
    text-shadow: 0 2px 18px rgba(0,0,0,.9);
  }
  #action {
    margin: 0; max-width: 34rem; text-align: center; color: var(--accent);
    font-size: clamp(15px, 3.9vw, 18px); font-weight: 600; line-height: 1.35;
    text-shadow: 0 2px 14px rgba(0,0,0,.95);
  }
  #toast {
    margin: 0; max-width: 34rem; text-align: center; font-size: 14px; line-height: 1.35;
    color: var(--w-accent); text-shadow: 0 2px 14px rgba(0,0,0,.95);
  }
  #chapterTitle {
    margin: 0; text-align: center; color: var(--dim); font-size: 13px;
    letter-spacing: .09em; text-transform: lowercase;
  }
  #chapterTitle b { display: block; color: var(--ink); font-size: 17px; letter-spacing: 0; text-transform: none; font-weight: 600; margin-top: 2px; }
  #modeHint { margin: 0; max-width: 30rem; text-align: center; font-size: 12px; line-height: 1.35; color: var(--dim); }

  /* -------------------------------------------------------------- bottoni */
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
    color: var(--ink); font: inherit; font-size: 16px; padding: 12px 18px; border-radius: 999px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform 180ms var(--ease), background 180ms var(--ease);
  }
  .btn:active { transform: scale(.96); background: rgba(255,255,255,.14); }
  .btn.primary { background: rgba(142,197,255,.16); border-color: rgba(142,197,255,.5); color: #dcecff; }
  #choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }

  /* ------------------------------------------------------------ cold open */
  #coldopen {
    position: absolute; inset: auto 0 0 0; padding: 0 var(--pad) calc(40px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  #coldopen p { margin: 0; font-size: clamp(19px, 5vw, 25px); text-align: center; text-shadow: 0 2px 20px #000; }
  #coldopenBtns { display: flex; gap: 10px; }

  /* -------------------------------------------------------------- comandi */
  /* Il contenitore dei comandi copre lo schermo ma NON deve mangiarsi i tocchi:
     solo gli stick e il cursore ricevono, il resto passa alla scena. */
  #hud #controls { position: absolute; inset: 0; pointer-events: none; }
  #controls .stick, #controls #wrap, #controls #wrap * { pointer-events: auto; }
  .stick {
    position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); width: 116px; height: 116px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.04);
    display: grid; place-items: center;
  }
  #stickL { left: var(--pad); }
  #stickR { right: calc(var(--pad) + 62px); }
  .knob { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.22); transition: transform 60ms linear; }
  #stickR.wmode { border-color: var(--w-accent); box-shadow: 0 0 26px rgba(255,190,107,.35) inset; }
  #stickR.wmode .knob { background: rgba(255,190,107,.55); }

  #wrap { position: absolute; right: var(--pad); bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #wslider {
    width: 46px; height: 168px; border-radius: 26px; border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(#ffbe6b22, transparent 45%, transparent 55%, #8ec5ff22); position: relative;
  }
  #wknob { position: absolute; left: 5px; width: 34px; height: 34px; border-radius: 50%; background: var(--w-accent); top: 66px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #wvalue { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--w-accent); }
  #wcaption { font-size: 10px; letter-spacing: .04em; color: var(--dim); max-width: 60px; text-align: center; line-height: 1.2; }
  #wbutton { width: 52px; height: 52px; border-radius: 50%; padding: 0; font-weight: 700; }
  @keyframes wpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,190,107,0); }
    50% { box-shadow: 0 0 0 12px rgba(255,190,107,.16); }
  }
  /* 1,6 s = 0,63 Hz: ben sotto le tre volte al secondo della WCAG */
  #wrap.pulse #wslider { animation: wpulse 1.6s var(--ease) infinite; border-color: var(--w-accent); }
  @media (prefers-reduced-motion: reduce) {
    #wrap.pulse #wslider { animation: none; border-color: var(--w-accent); box-shadow: 0 0 0 6px rgba(255,190,107,.14); }
  }
  #wbutton.on { background: rgba(255,190,107,.22); border-color: var(--w-accent); color: var(--w-accent); }

  /* sotto il riquadro degli obiettivi: la bussola non va mai coperta */
  #compass { align-self: flex-start; width: 128px; height: 92px; }
  #modeBar {
    position: absolute; right: var(--pad); top: calc(12px + env(safe-area-inset-top));
    display: flex; gap: 8px; align-items: center;
  }
  /* 44 px è il minimo perché un dito lo prenda: sotto, il tasto "non si clicca". */
  .chip {
    font-size: 13px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: var(--dim);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chip:active { background: rgba(255,255,255,.16); }
  .chip.on { color: var(--ink); border-color: rgba(142,197,255,.55); background: rgba(142,197,255,.14); }

  /* -------------------------------------------------------------- pannello */
  #panel {
    position: absolute; inset: 0; background: rgba(6,7,10,.92); backdrop-filter: blur(18px);
    padding: calc(24px + env(safe-area-inset-top)) var(--pad) calc(24px + env(safe-area-inset-bottom));
    overflow: auto; display: flex; flex-direction: column; gap: 18px;
  }
  #panel h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row label { color: var(--dim); }
  input[type=range] { width: 150px; }
  #panel .btn { align-self: flex-start; }

  /* Sotto il cofano: le formule, con una manopola ciascuna. */
  #lab {
    position: absolute; inset: 0; background: rgba(6,7,10,.96); backdrop-filter: blur(18px);
    padding: calc(20px + env(safe-area-inset-top)) var(--pad) calc(90px + env(safe-area-inset-bottom));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #lab h2 { margin: 0 0 4px; font-size: 22px; }
  .lab-intro { margin: 0 0 20px; color: var(--dim); font-size: 15px; }
  .lab-card {
    border: 1px solid rgba(255,255,255,.10); border-radius: 16px; padding: 14px 14px 12px;
    margin-bottom: 16px; background: rgba(255,255,255,.03);
  }
  .lab-card h3 { margin: 0 0 10px; font-size: 17px; font-weight: 600; }
  .lab-formula {
    margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; overflow-x: auto;
    background: rgba(142,197,255,.08); border-left: 2px solid var(--accent);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe4ff; white-space: pre;
  }
  .lab-readout {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; overflow-x: auto;
    background: rgba(0,0,0,.35); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink); white-space: pre;
  }
  .lab-meaning { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--dim); }
  .lab-row { display: grid; grid-template-columns: 3.4rem 1fr 3.6rem; gap: 10px; align-items: center; padding: 3px 0; }
  .lab-row label { font: 12px ui-monospace, monospace; color: var(--dim); }
  .lab-row input[type=range] { width: 100%; }
  .lab-row output { font: 12px ui-monospace, monospace; color: var(--accent); text-align: right; }
  .lab-canvas { width: 100%; height: 120px; display: block; margin-top: 10px; }
  .lab-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .lab-buttons .btn { font-size: 14px; padding: 10px 14px; min-height: 44px; }
  #labClose {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5;
  }

  #flatstrip { width: 100%; height: 46px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); display: block; }
  #flatwrap { width: min(92vw, 30rem); }

  /* Gli obiettivi: cosa ci fai qui dentro. Senza, è una stanza con degli oggetti. */
  #goals {
    width: min(88vw, 22rem); padding: 14px 16px; border-radius: 16px;
    background: rgba(12,14,19,.82); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  #goals h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .04em; }
  #goals ul { margin: 0; padding: 0; list-style: none; }
  #goals li {
    display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 15px; line-height: 1.35;
    transition: color 320ms var(--ease), opacity 320ms var(--ease);
  }
  #goals li .mark { flex: 0 0 18px; color: var(--dim); transition: color 320ms var(--ease), transform 320ms var(--ease); }
  #goals li.done { color: var(--dim); }
  #goals li.done .mark { color: var(--accent); transform: scale(1.15); }
  #goals li.done span:last-child { text-decoration: line-through; opacity: .6; }

  #toast {
    max-width: 34rem; text-align: center; font-size: 14px; line-height: 1.35;
    color: var(--w-accent); text-shadow: 0 2px 14px rgba(0,0,0,.95);
  }
  #toast.hidden { display: none; }
  #share { align-self: center; }
  #recdot { font-size: 12px; color: #ff8a8a; }
  #fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 8vw; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="modeBar" class="fade hidden">
    <button class="chip" id="modeProjection">ombra</button>
    <button class="chip" id="modeSection">fetta</button>
    <button class="chip gone" id="goalChip">0/3</button>
    <button class="chip gone" id="objectChip">tazza</button>
    <button class="chip" id="menuBtn">≡</button>
  </div>

  <!-- Pila in alto: gli elementi si impilano, non si sovrappongono mai. -->
  <div id="top">
    <div id="chapterTitle" class="fade hidden"></div>
    <div id="modeHint" class="fade hidden"></div>
    <div id="goals" class="fade hidden">
      <h3 id="goalsTitle"></h3>
      <ul id="goalsList"></ul>
    </div>
    <canvas id="compass" class="fade hidden"></canvas>
  </div>

  <!-- Pila in basso, sopra la fascia dei comandi. Stesso principio. -->
  <div id="texts">
    <div id="recdot" class="fade hidden">● 6s</div>
    <div id="toast" class="fade hidden"></div>
    <div id="subtitle" class="fade hidden"></div>
    <div id="action" class="fade hidden"></div>
    <div id="flatwrap" class="fade hidden"><canvas id="flatstrip"></canvas></div>
    <div id="choices" class="fade hidden"></div>
    <button id="share" class="btn primary fade hidden">manda a un amico</button>
  </div>

  <div id="coldopen" class="fade hidden">
    <p id="coldopenText"></p>
    <div id="coldopenBtns"></div>
  </div>

  <div id="controls" class="fade hidden">
    <div class="stick" id="stickL"><div class="knob" id="knobL"></div></div>
    <div class="stick" id="stickR"><div class="knob" id="knobR"></div></div>
    <div id="wrap">
      <button class="btn" id="wbutton">W</button>
      <div id="wslider"><div id="wknob"></div></div>
      <div id="wvalue">w 0.00</div>
      <div id="wcaption">quarta direzione</div>
    </div>
  </div>

  <div id="panel" class="fade gone"></div>
  <div id="lab" class="fade gone"></div>
</div>

<noscript><div id="fatal">Questo gioco ha bisogno di JavaScript.</div></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
